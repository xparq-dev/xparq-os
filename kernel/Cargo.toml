# XPARQ OS Kernel - Phase 1: OS & Kernel Foundations
# Zircon-based kernel with object-capability security model
# no_std configuration for bare-metal execution

[package]
name = "xparq-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xparq_kernel"
path = "src/main_simple.rs"

[dependencies]
# no_std core dependencies
spin = "0.9"
volatile = "0.5"
bitflags = "2.4"
static_assertions = "1.1"
arrayvec = { version = "0.7", default-features = false }

# Architecture-specific dependencies (optional)
aarch64-cpu = { version = "9.4", optional = true }
x86_64 = { version = "0.14", default-features = false, optional = true }

# FIDL interface definitions
xparq-fidl = { path = "../interfaces/fidl" }

# Hardware Abstraction Layer
xparq-hal = { path = "../hal", default-features = false, features = ["kernel"] }

[features]
default = []
arm64 = ["aarch64-cpu"]
x86_64 = ["dep:x86_64"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
