# XPARQ OS - Phase 02: Simple Kernel for Boot Verification
# Minimal kernel for Phase 2 boot testing without complex dependencies

[package]
name = "xparq-kernel-simple"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xparq_kernel"
path = "src/main.rs"

[dependencies]
# No external dependencies for no_std kernel

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
