#
# [env.testing]
# RUST_LOG = "trace"
# RUST_BACKTRACE = "full"

# Documentation configuration
[doc]
# Enable browser for documentation
browser = "auto"

# Clippy configuration
[clippy]
# Enable all clippy lints
warn-all = true
# Allow certain lints for no_std development
allow = [
    "dead_code",        # Allow dead code in development
    "unused_imports",   # Allow unused imports in development
    "unused_variables", # Allow unused variables in development
]

# Rustfmt configuration
[fmt]
# Use 4-space indentation
hard_tabs = false
tab_spaces = 4
# Use Unix line endings
newline_style = "Unix"
# Format all items
use_small_heuristics = "Default"
# Use field initialization shorthand
use_field_init_shorthand = true
# Use try blocks
use_try_shorthand = true

